# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Why a persistent web service and not a serverless function: this app keeps
# state in the Node process itself. The daily housekeeping (late-payment
# charges, building the month's billing cycle) is fired without awaiting so
# the first person in each morning is not left staring at a spinner, and the
# "already seeded" / "already ran today" guards are module-level variables.
# On a function that is frozen the moment it returns a response, neither
# survives. A long-running server is what the code was written against.
#
# The database and file storage are Supabase, not Render — do NOT add a
# Render Postgres here. Its free instances are wiped after 30 days.

services:
  - type: web
    name: hostel-operations
    runtime: node
    plan: free
    # Closest region to Malaysia; keeps the round trip to Supabase short.
    region: singapore

    # `next start` is explicitly unsupported with output: "standalone" (Next
    # prints a warning and tells you to run the server directly), so the
    # build copies the two directories the traced bundle does not include and
    # the standalone server is what actually runs.
    buildCommand: npm ci && npm run build:standalone
    startCommand: npm run start:standalone

    # Returns 200 without a session, so it works as a liveness probe.
    healthCheckPath: /login

    envVars:
      # engines requires >= 22.13.0; pinned so a Render default bump cannot
      # change the runtime under the app without anyone deciding to.
      - key: NODE_VERSION
        value: "22.13.0"
      # Next's standalone server binds to `process.env.HOSTNAME || "0.0.0.0"`
      # (.next/standalone/server.js). Render sets HOSTNAME to the container's
      # own name, so without this the server listens on that one interface,
      # Render's proxy cannot reach it, and every request is a 502 even though
      # the logs say the service is live.
      - key: HOSTNAME
        value: "0.0.0.0"
      # sync: false means "prompt me for this in the dashboard, never store
      # it in the repo". All three are secrets.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Deliberately absent: CPANEL_BASE_PATH. It exists only because cPanel
      # serves the app under /system without stripping the prefix. On Render
      # the app is at the domain root, and setting it would break every
      # asset and API path.
